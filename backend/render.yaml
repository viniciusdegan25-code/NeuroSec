services:
  - type: web
    name: neurosec-aspm-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:///./neurosec.db
      - key: CORS_ORIGINS
        value: "*"
